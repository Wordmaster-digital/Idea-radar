name: Opportunity Radar

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunity-radar-daily
  cancel-in-progress: false

jobs:
  opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: opportunity_radar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install report dependencies and Korean font
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
      - name: Validate the bot
        run: python -m unittest discover -s tests -v
      - name: Restore opportunity delivery state
        uses: actions/cache/restore@v6
        with:
          path: opportunity_radar/state
          key: opportunity-seen-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: opportunity-seen-v1-
      - name: Discover opportunities and send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.OPPORTUNITY_DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPPORTUNITY_REPORT_FONT: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
          PYTHONUTF8: '1'
        run: python radar.py --cloud
      - name: Save acknowledged opportunity state
        if: success()
        uses: actions/cache/save@v6
        with:
          path: opportunity_radar/state
          key: opportunity-seen-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Confirm the delivered Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.OPPORTUNITY_DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUTF8: '1'
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlsplit, urlunsplit
          from urllib.request import Request, urlopen
          saved = json.loads(Path('state/seen.json').read_text(encoding='utf-8'))
          message_id = str(saved.get('message_id', ''))
          p = urlsplit(os.environ['DISCORD_WEBHOOK_URL'])
          if (not message_id.isdigit() or p.scheme != 'https' or p.username or p.password
              or p.port not in (None,443) or p.hostname not in ('discord.com','discordapp.com')
              or not re.fullmatch(r'/api/webhooks/\d+/[\w-]+',p.path)):
              raise SystemExit('Discord receipt verification settings are invalid')
          url = urlunsplit((p.scheme,p.netloc,p.path+'/messages/'+message_id,'',''))
          try:
              req = Request(url,headers={'User-Agent':'OpportunityRadar/1.0 (+https://github.com/Wordmaster-digital/Idea-radar)'})
              with urlopen(req,timeout=30) as response:
                  message = json.load(response)
          except HTTPError as error:
              raise SystemExit('Discord receipt verification HTTP '+str(error.code)) from None
          except Exception as error:
              raise SystemExit('Discord receipt verification failed: '+type(error).__name__) from None
          attachments = message.get('attachments',[])
          if (str(message.get('id')) != message_id or not message.get('content','').startswith('🧭 기회 레이더')
              or not any(a.get('filename','').endswith(('.pdf','.md')) for a in attachments)):
              raise SystemExit('Discord receipt does not match the expected report')
          print('Discord receipt verified: '+message_id)
          print('Report attachment verified: '+str(len(attachments)))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write('## Discord receipt verified\n\nMessage ID: '+message_id+
                            '\n\nReport attachment: present\n\nDelivery date: '+saved['last_delivery']+'\n')
          PY
      - name: Show collection and delivery result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          files = sorted(Path('reports').glob('*.json'))
          if files:
              report = json.loads(files[-1].read_text(encoding='utf-8'))
              stats = report.get('cloud_stats', {})
              lines = ['## Opportunity Radar',
                       'Date: ' + report['date'],
                       'Discovered: ' + str(len(report['all_discovered'])),
                       'Notifications: ' + str(len(report['selected'])),
                       'Delivery: ' + report['delivery'],
                       'Discord message ID: ' + report.get('message_id','none'),
                       'Search provider: ' + stats.get('provider','unknown'),
                       'Domains discovered: ' + str(stats.get('discovered_domains',0))]
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
                  summary.write('\n\n'.join(lines)+'\n')
          PY
