name: KR Idea Radar (no-LLM backup)

on:
  schedule:
    - cron: "0 23 * * *"   # 08:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    # Set this variable after the local scheduled run is ready to avoid duplicate delivery.
    if: github.event_name == 'workflow_dispatch' || vars.IDEA_LOCAL_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Restore seen state
        uses: actions/cache/restore@v6
        with:
          path: state
          key: kr-seen-${{ github.run_id }}
          restore-keys: kr-seen-

      - name: Send digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IDEA_LLM_MODE: "off"
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python kr_digest.py --no-llm

      - name: Save seen state
        if: success()
        uses: actions/cache/save@v6
        with:
          path: state
          key: kr-seen-${{ github.run_id }}
